name: build_and_test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Pinned to 22.04: Tauri v1 needs libwebkit2gtk-4.0-dev, which isn't
    # available on the 24.04 image ubuntu-latest now points to. Revisit
    # this pin when the app moves to Tauri v2 (#25).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: npm ci

      - name: build frontend
        # tauri::generate_context!() needs `dist/` to exist at compile time,
        # even though this job only builds/tests the Rust backend.
        run: npm run build

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --verbose

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose
