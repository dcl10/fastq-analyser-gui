name: publish

# Create a release in the GitHub UI (Releases -> Draft a new release -> Publish
# release) and this workflow builds the desktop app for macOS, Linux and
# Windows and attaches the installers to that release as assets.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # arm64 + x86_64 combined into one universal build
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization — inert until these secrets exist
          # (the build is just unsigned in the meantime). See:
          # https://v2.tauri.app/distribute/sign/macos/
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing isn't wired up here yet: unlike macOS, Tauri
          # doesn't take a certificate via env vars — it needs a cert already
          # in the Windows certificate store (imported in an earlier step from
          # a secret) plus a matching `bundle.windows.certificateThumbprint`
          # in tauri.conf.json. See: https://v2.tauri.app/distribute/sign/windows/
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
