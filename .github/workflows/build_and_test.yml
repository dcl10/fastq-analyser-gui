name: build_and_test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Tauri v2 needs libwebkit2gtk-4.1-dev, which is only on the 24.04 image
    # ubuntu-latest now points to (v1's 4.0 package needed the 22.04 pin this
    # used to have).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        # `npm ci` fails here with "Missing: @emnapi/runtime@1.11.3 from
        # lock file" — @tailwindcss/oxide-wasm32-wasi lists @emnapi/* as
        # bundleDependencies, which npm's lockfile v3 doesn't resolve
        # consistently across platforms (reproduces even with a lockfile
        # freshly regenerated via `npm install`). `npm install` reconciles
        # instead of hard-failing, so it sidesteps the bug.
        run: npm install

      - name: lint frontend
        run: npm run lint

      - name: build frontend
        # tauri::generate_context!() needs `out/` (the static export) to
        # exist at compile time, even though this job only builds/tests the
        # Rust backend.
        run: npm run build

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --verbose

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose
