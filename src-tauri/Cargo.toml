[package]
name = "fastq_analyser"
version = "0.4.0"
description = "A desktop application that analyses FastQ and FASTA records."
authors = ["dcl10"]
license = "MIT"
repository = "https://github.com/dcl10/fastq-analyser-gui"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
bio = "1.2.0"
flate2 = "1.0.26"
uuid = { version = "1.3.4", features = ["v4"] }
