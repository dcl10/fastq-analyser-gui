name: publish

# Create a release in the GitHub UI (Releases -> Draft a new release -> Publish
# release) and this workflow builds the desktop app for macOS, Linux and
# Windows and attaches the installers to that release as assets.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # arm64 + x86_64 combined into one universal build
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: enable Corepack
        # Bare `corepack enable` only shims Yarn/pnpm by default — npm needs
        # to be named explicitly to have Corepack override Node's bundled npm.
        run: corepack enable npm

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Releases are unsigned for now. macOS builds are ad-hoc signed
          # (`bundle.macOS.signingIdentity: "-"` in tauri.conf.json) so a
          # downloaded app can be opened via Privacy & Security -> Open Anyway
          # instead of being reported as damaged. To sign and notarize, add an
          # Apple Developer certificate as repo secrets and pass APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID here. They're left out until then:
          # a missing secret still sets the variable (to ""), which would
          # override the ad-hoc identity. See:
          # https://v2.tauri.app/distribute/sign/macos/
          # Windows code signing isn't wired up either: unlike macOS, Tauri
          # doesn't take a certificate via env vars — it needs a cert already
          # in the Windows certificate store (imported in an earlier step from
          # a secret) plus a matching `bundle.windows.certificateThumbprint`
          # in tauri.conf.json. See: https://v2.tauri.app/distribute/sign/windows/
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
